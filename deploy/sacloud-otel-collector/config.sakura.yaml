# sacloud-otel-collector configuration for SAKURA Cloud Object Storage
# https://github.com/sacloud/sacloud-otel-collector

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 2s
    send_batch_size: 10

exporters:
  awss3:
    s3uploader:
      endpoint: ${env:SACLOUD_O2_ENDPOINT}
      region: ${env:SACLOUD_O2_REGION}
      s3_bucket: ${env:SACLOUD_O2_BUCKET}
      s3_prefix: ${env:SACLOUD_O2_PREFIX}
      s3_partition_format: '%Y/%m/%d/%H'
      s3_force_path_style: true
      disable_ssl: false
      compression: gzip
    marshaler: otlp_json

  # Optional debug exporter to inspect logs in stdout
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awss3, debug]

  telemetry:
    logs:
      level: info
