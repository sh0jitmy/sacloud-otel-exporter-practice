# sacloud-otel-collector configuration for Docker Container Log Collection with Sakura Cloud Object Storage
# https://github.com/sacloud/sacloud-otel-collector

receivers:
  filelog:
    include:
      - /var/log/docker-app/*.log
    start_at: beginning
    poll_interval: 500ms
    operators:
      - type: json_parser
        id: docker_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: add
        field: attributes["source"]
        value: "docker_container"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 2s
    send_batch_size: 5

exporters:
  awss3:
    s3uploader:
      endpoint: ${env:SACLOUD_O2_ENDPOINT}
      region: ${env:SACLOUD_O2_REGION}
      s3_bucket: ${env:SACLOUD_O2_BUCKET}
      s3_prefix: ${env:SACLOUD_O2_PREFIX}
      s3_partition_format: '%Y/%m/%d/%H'
      s3_force_path_style: true
      disable_ssl: false
      compression: gzip
    marshaler: otlp_json

  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, batch]
      exporters: [awss3, debug]

  telemetry:
    logs:
      level: info
